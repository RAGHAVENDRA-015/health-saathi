version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthsaathi-backend
    restart: unless-stopped
    ports:
      - '3001:8080'
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=8080
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/health/live']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend-4
      dockerfile: Dockerfile
    container_name: healthsaathi-frontend
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - backend
